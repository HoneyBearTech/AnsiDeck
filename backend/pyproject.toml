[project]
name = "ansideck-backend"
version = "0.1.0"
description = "AnsiDeck API — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.5",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "pyyaml>=6.0",
    "ansible>=14.4.0",
    "ansible-runner>=2.4,<3",
    "joserfc>=1.7.5",
    "pyotp>=2.9",
    "segno>=1.6",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "pytest-cov>=6",
    "hypothesis>=6",
]
# Atheris only ships Linux x86_64 wheels, so the fuzz harnesses run in CI (or an
# amd64 container), and syncing on a Mac or the arm64 dev container skips it.
fuzz = [
    "atheris>=3.1; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection system relies on calling Depends()/Query()/etc.
# as parameter defaults — that's the intended pattern, not the mutable-default
# footgun B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Header",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "no_worker: the client fixture starts no worker, so runs stay queued",
]

[tool.coverage.run]
source = ["app"]
branch = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
