[project]
name = "ansideck-backend"
version = "0.3.0"
description = "AnsiDeck API — FastAPI backend"
# 3.12.11+: tarfile's "data" filter has the 2025 path-escape fixes (app.run_worker unpacks
# git snapshots with it).
requires-python = ">=3.12.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.5",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "pyyaml>=6.0",
    "ansible>=14.4.0",
    "ansible-runner>=2.4,<3",
    "ansible-lint>=26.9.0",
    "joserfc>=1.7.5",
    "pyotp>=2.9",
    "segno>=1.6",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "prometheus-client>=0.21",
    "pytz>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "pytest-cov>=6",
    "hypothesis>=6",
]
# Atheris only ships Linux x86_64 wheels, so the fuzz harnesses run in CI (or an
# amd64 container), and syncing on a Mac or the arm64 dev container skips it.
fuzz = [
    "atheris>=3.1; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Maximally strict where practical (OpenSSF Silver warnings_strict): pycodestyle, pyflakes,
# isort, pyupgrade, bugbear, bandit (S), async, blind except, simplify, ruff's own rules,
# comprehensions, performance, naming, pytest style, unused arguments, return/pie/print/debugger
# checks, string concatenation, import conventions, logging, namespace packages, pygrep hooks,
# pylint errors and warnings, refurb and timezone-aware datetimes.
select = [
    "E", "F", "I", "UP", "B", "S", "ASYNC", "BLE", "SIM", "RUF", "C4", "PERF", "N", "PT", "ARG",
    "PIE", "RET", "T10", "T20", "EXE", "ISC", "ICN", "LOG", "G", "INP", "PGH", "PLE", "PLW",
    "FURB", "DTZ",
]
# Exceptions are named for what happened (RateLimited, RunRefused, TooDeep); an Error suffix
# would add nothing.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Tests: plain asserts are pytest's idiom; fixture passwords, temp paths and SQL are test data;
# fixtures are requested for their side effects; composite asserts read better in long tests.
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S603", "S607", "S608", "ARG", "PT018"]
# Command-line tools print by design.
"scripts/**" = ["T201", "INP001"]
"fuzz/**" = ["T201", "INP001"]
"app/cli.py" = ["T201"]
"migrations/**" = ["INP001"]
# FastAPI endpoints called test_* (e.g. "send a test notification") aren't pytest tests.
"app/**" = ["PT"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection system relies on calling Depends()/Query()/etc.
# as parameter defaults — that's the intended pattern, not the mutable-default
# footgun B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Header",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings fail the suite (OpenSSF Silver warnings_strict); ignore specific ones below, with a reason.
filterwarnings = [
    "error",
    # Starlette is moving its TestClient from httpx to httpx2; FastAPI's TestClient still wraps it.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # ...and still names anyio's old BlockingPortal alias in its type hints.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
    # uvloop (uvicorn's event loop in the live-server tests) calls this on Python 3.14.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
markers = [
    "no_worker: the client fixture starts no worker, so runs stay queued",
]

[tool.coverage.run]
source = ["app"]
branch = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
