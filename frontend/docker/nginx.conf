# How long browsers may keep a response: Vite's hashed /assets/ never change, while index.html
# (and the app's routes, which serve it) must be revalidated, or a browser could keep a page
# that points at the previous release's assets after an upgrade. The API sets its own.
map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/    "";
    default    "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browser hardening for the app and the API responses proxied through it. `always` adds the
    # headers to error responses too; no location below sets its own add_header, so all inherit
    # these. HSTS belongs on the TLS-terminating reverse proxy, not here.
    #   style-src 'unsafe-inline': Radix dialogs inject a <style> element to lock page scrolling.
    #   connect-src 'self' covers the same-origin WebSocket for live run output.
    #   img-src data: is the two-factor setup's QR code (an SVG data: URI from the API).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control $cache_control;  # successful responses only: never cache a 404

    # Resolve the backend hostname at request time (Docker's embedded DNS),
    # not at config load — otherwise nginx refuses to start if the backend
    # container isn't resolvable yet when this container boots.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # No path after the variable: nginx forwards the original request
        # URI (e.g. /api/health) unchanged, which matches the backend's
        # own routes (they already include the /api prefix).
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        # $http_host (not $host) keeps the port, so the backend's same-origin
        # check (Origin vs Host) matches what the browser sent.
        proxy_set_header Host $http_host;
        # The client: the peer, or what a trusted reverse proxy says in X-Forwarded-For
        # (00-real-ip.conf, from TRUSTED_PROXIES). The API trusts this header from us only.
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket upgrade support (run log streaming) — without these,
        # nginx proxies the upgrade request as a normal HTTP request and
        # the connection silently fails to upgrade.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # A missing asset is a 404, not index.html (which a browser would refuse as a script).
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
