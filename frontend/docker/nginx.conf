server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browser hardening for the app and the API responses proxied through it. `always` adds the
    # headers to error responses too; no location below sets its own add_header, so all inherit
    # these. HSTS belongs on the TLS-terminating reverse proxy, not here.
    #   style-src 'unsafe-inline': Radix dialogs inject a <style> element to lock page scrolling.
    #   connect-src 'self' covers the same-origin WebSocket for live run output.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Resolve the backend hostname at request time (Docker's embedded DNS),
    # not at config load — otherwise nginx refuses to start if the backend
    # container isn't resolvable yet when this container boots.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # No path after the variable: nginx forwards the original request
        # URI (e.g. /api/health) unchanged, which matches the backend's
        # own routes (they already include the /api prefix).
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        # $http_host (not $host) keeps the port, so the backend's same-origin
        # check (Origin vs Host) matches what the browser sent.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket upgrade support (run log streaming) — without these,
        # nginx proxies the upgrade request as a normal HTTP request and
        # the connection silently fails to upgrade.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
