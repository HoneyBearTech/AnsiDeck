services:
  postgres:
    image: postgres:18-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: ansideck
      POSTGRES_DB: ansideck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ansideck}
      # Byte-order text sorting (what SQLite did), independent of the host's glibc/ICU.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql
    # Loopback only: for running the backend tests from the host. Never expose it further.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ansideck -d ansideck"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://ansideck:${POSTGRES_PASSWORD:-ansideck}@postgres:5432/ansideck}
      # The internal worker API (never published): reachable from the workers network only.
      - INTERNAL_API_HOST=0.0.0.0
      - WORKER_TOKEN=${WORKER_TOKEN:-change-me-dev-only-worker-token}
      # Prometheus metrics: nothing listens until METRICS_TOKEN is set in .env.
      - METRICS_HOST=0.0.0.0
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv
      - backend-data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
      # Loopback only, for a Prometheus on this machine (host.docker.internal:8002 from a
      # container). Never publish it further.
      - "127.0.0.1:${BACKEND_METRICS_PORT:-8002}:8002"
    command: ["uv", "run", "fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [default, db, workers, secrets]
    depends_on:
      postgres:
        condition: service_healthy

  # Runs playbooks. Scale with `docker compose up --scale worker=N`. It gets an explicit
  # environment only (never the .env file: no database URL, no keys) and is on the workers
  # network only, so it can reach the backend's internal API but not Postgres.
  worker:
    build:
      context: ./backend
      target: dev
    # The worker itself is PID 1 (no init, no `uv run` wrapper): it hides its memory and
    # environment from playbooks and reaps orphans itself. A wrapper process would hold the
    # container's environment, WORKER_TOKEN included, where a playbook could read it.
    command: ["/app/.venv/bin/python", "-m", "app.worker"]
    # Playbooks run as a user of their own per slot (ansideck-run<n>, no capabilities), so
    # they can't read the worker's token, signal it, or touch other runs' files and
    # processes. Switching to those users takes root, with nothing more than these four
    # capabilities (SETUID/SETGID: switch, CHOWN: create their homes, KILL: stop and clean
    # up runs). Without them a production worker refuses to start.
    user: "0"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL]
    security_opt: ["no-new-privileges:true"]
    # Runs can write only to /tmp (their private data dirs) and /dev/shm, which the worker
    # sweeps after every run; nothing they leave can reach the next one.
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 1024
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PATH=/app/.venv/bin:/usr/local/bin:/usr/bin:/bin
      - ANSIDECK_API_URL=http://backend:8001
      - WORKER_TOKEN=${WORKER_TOKEN:-change-me-dev-only-worker-token}
      - WORKER_SLOTS=${WORKER_SLOTS:-2}
      - GALAXY_DIR=/galaxy
    volumes:
      - ./backend:/app:ro
      - backend-venv:/app/.venv:ro
      # Installed roles/collections, read-only: only the backend installs.
      - type: volume
        source: backend-data
        target: /galaxy
        read_only: true
        volume:
          subpath: galaxy
    # Lets running runs finish (WORKER_DRAIN_SECONDS, 30 s) before they are stopped.
    stop_grace_period: 60s
    networks: [workers]
    depends_on:
      backend:
        condition: service_healthy

  # Development only (`docker compose --profile openbao up -d`): an OpenBao dev server, to try
  # keeping credentials and vault passwords in a secret store. It keeps everything in memory
  # (gone when it restarts) and its root token is a fixed dev default; never use it for real
  # secrets. Set it up with backend/scripts/openbao_dev_setup.py (see the README). Only the
  # backend is on the secrets network: workers can't reach the store.
  openbao:
    profiles: [openbao]
    image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=${OPENBAO_DEV_ROOT_TOKEN:-dev-only-root-token}
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      # For `docker compose exec openbao bao ...`.
      - BAO_ADDR=http://127.0.0.1:8200
      - BAO_TOKEN=${OPENBAO_DEV_ROOT_TOKEN:-dev-only-root-token}
    # Loopback only, for the bao CLI and API on this machine.
    ports:
      - "127.0.0.1:${OPENBAO_PORT:-8200}:8200"
    networks: [secrets]
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file: .env
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
      - VITE_API_BASE_URL=/api
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      backend:
        condition: service_healthy

networks:
  db:
  workers:
  secrets:

volumes:
  postgres-data:
  backend-venv:
  frontend-node-modules:
  backend-data:
