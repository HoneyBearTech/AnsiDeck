services:
  postgres:
    image: postgres:18-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: ansideck
      POSTGRES_DB: ansideck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ansideck}
      # Byte-order text sorting (what SQLite did), independent of the host's glibc/ICU.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql
    # Loopback only: for running the backend tests from the host. Never expose it further.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ansideck -d ansideck"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://ansideck:${POSTGRES_PASSWORD:-ansideck}@postgres:5432/ansideck}
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv
      - backend-data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: ["uv", "run", "fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file: .env
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
      - VITE_API_BASE_URL=/api
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  backend-venv:
  frontend-node-modules:
  backend-data:
