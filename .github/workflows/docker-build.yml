name: Docker Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            target: dev
          - service: backend
            target: runtime
          - service: frontend
            target: dev
          - service: frontend
            target: runtime

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: ansideck-${{ matrix.service }}:${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.target }}

      - name: Smoke test backend runtime image
        if: matrix.service == 'backend' && matrix.target == 'runtime'
        # The app needs Postgres (same pinned image as docker-compose.yml) and applies its
        # migrations at startup, so this also checks the image ships alembic.ini + migrations/
        # (the database must end at the image's own head revision).
        run: |
          docker network create smoke-net
          docker run -d --name smoke-db --network smoke-net \
            -e POSTGRES_USER=ansideck -e POSTGRES_PASSWORD=ci-test -e POSTGRES_DB=ansideck \
            --health-cmd "pg_isready -U ansideck -d ansideck" --health-interval 2s \
            postgres:18-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke-db)" = healthy ] && break
            sleep 2
          done
          docker run -d --name smoke --network smoke-net -p 8000:8000 \
            -e AUTH_SECRET_KEY=ci-test -e ADMIN_PASSWORD=ci-test \
            -e INTERNAL_API_HOST=0.0.0.0 -e WORKER_TOKEN=ci-test-worker-token-0123456789abcdef \
            -e CREDENTIAL_ENCRYPTION_KEY=8JQKBeSl5G-WvrMG3wRXlVUrowrX3qAkZq0Nycsd9qc= \
            -e DATABASE_URL=postgresql+psycopg://ansideck:ci-test@smoke-db:5432/ansideck \
            ansideck-backend:runtime
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/api/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/api/health || { docker logs smoke; exit 1; }
          docker logs smoke
          head=$(docker exec -w /app smoke alembic heads | cut -d' ' -f1)
          applied=$(docker exec smoke-db psql -U ansideck -d ansideck -tAc "SELECT version_num FROM alembic_version")
          echo "image head: $head, database: $applied"
          [ -n "$head" ] && [ "$head" = "$applied" ]

      - name: Smoke test ansible-galaxy prerequisites in backend runtime image
        if: matrix.service == 'backend' && matrix.target == 'runtime'
        run: |
          docker exec smoke ansible-galaxy --version
          docker exec smoke git --version
          docker exec smoke sh -c 'mkdir -p /data/galaxy/collections && touch /data/galaxy/collections/.write-test'

      - name: Smoke test a worker from the backend runtime image
        if: matrix.service == 'backend' && matrix.target == 'runtime'
        # A worker reaches only the API's internal port, gets no database URL or keys, is
        # non-dumpable (playbooks run as its user), and runs a real playbook to success.
        run: |
          docker run -d --name smoke-worker --network smoke-net \
            -e ANSIDECK_API_URL=http://smoke:8001 \
            -e WORKER_TOKEN=ci-test-worker-token-0123456789abcdef \
            ansideck-backend:runtime python -m app.worker
          for i in $(seq 1 15); do
            docker logs smoke-worker 2>&1 | grep -q " ready: " && break
            sleep 2
          done
          docker logs smoke-worker 2>&1 | grep -q " ready: " || { docker logs smoke-worker; exit 1; }
          if docker exec smoke-worker cat /proc/1/environ > /dev/null; then
            echo "the worker's environment is readable by its own user"; exit 1
          fi
          if docker exec smoke-worker env | grep -E 'DATABASE_URL|CREDENTIAL_ENCRYPTION_KEY|AUTH_SECRET_KEY'; then
            echo "the worker has the API's secrets"; exit 1
          fi
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/smoke_key"
          python3 backend/scripts/smoke_run.py http://localhost:8000 ci-test "$RUNNER_TEMP/smoke_key" \
            || { docker logs smoke-worker; docker logs smoke; exit 1; }
          docker logs smoke-worker

      - name: Smoke test frontend runtime image
        if: matrix.service == 'frontend' && matrix.target == 'runtime'
        run: |
          docker run -d --name smoke -p 8080:8080 ansideck-frontend:runtime
          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/ && break
            sleep 2
          done
          curl -sf http://localhost:8080/ | grep -q "AnsiDeck"
          docker logs smoke
