name: Docker Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            target: dev
          - service: backend
            target: runtime
          - service: frontend
            target: dev
          - service: frontend
            target: runtime

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: ansideck-${{ matrix.service }}:${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.target }}

      - name: Run isolation tests as the worker runs them
        if: matrix.service == 'backend' && matrix.target == 'dev'
        # Real playbooks as per-slot users, in the image with the worker's compose settings
        # (root with only four capabilities, read-only root filesystem). Fails instead of
        # skipping if the image or these flags no longer allow isolation.
        run: |
          docker run --rm --user 0 --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID --cap-add CHOWN --cap-add KILL \
            --security-opt no-new-privileges:true --read-only --tmpfs /tmp \
            -e PYTHONDONTWRITEBYTECODE=1 -e ANSIDECK_REQUIRE_ISOLATION=1 \
            -e PATH=/app/.venv/bin:/usr/local/bin:/usr/bin:/bin \
            ansideck-backend:dev \
            python -m pytest --noconftest -p no:cacheprovider tests/test_isolation_root.py

      - name: Smoke test backend runtime image
        if: matrix.service == 'backend' && matrix.target == 'runtime'
        # The app needs Postgres (same pinned image as docker-compose.yml) and applies its
        # migrations at startup, so this also checks the image ships alembic.ini + migrations/
        # (the database must end at the image's own head revision).
        run: |
          docker network create smoke-net
          docker run -d --name smoke-db --network smoke-net \
            -e POSTGRES_USER=ansideck -e POSTGRES_PASSWORD=ci-test -e POSTGRES_DB=ansideck \
            --health-cmd "pg_isready -U ansideck -d ansideck" --health-interval 2s \
            postgres:18-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke-db)" = healthy ] && break
            sleep 2
          done
          # In a file and with a named /data volume: the secret store step restarts it.
          cat > "$RUNNER_TEMP/smoke.env" <<'ENV'
          AUTH_SECRET_KEY=ci-test
          ADMIN_PASSWORD=ci-test
          INTERNAL_API_HOST=0.0.0.0
          WORKER_TOKEN=ci-test-worker-token-0123456789abcdef
          METRICS_HOST=0.0.0.0
          METRICS_TOKEN=ci-test-metrics-token-0123456789abcdef
          CREDENTIAL_ENCRYPTION_KEY=8JQKBeSl5G-WvrMG3wRXlVUrowrX3qAkZq0Nycsd9qc=
          DATABASE_URL=postgresql+psycopg://ansideck:ci-test@smoke-db:5432/ansideck
          ENV
          docker run -d --name smoke --network smoke-net -p 8000:8000 -p 127.0.0.1:8002:8002 \
            --env-file "$RUNNER_TEMP/smoke.env" -v smoke-data:/data ansideck-backend:runtime
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/api/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/api/health || { docker logs smoke; exit 1; }
          docker logs smoke
          head=$(docker exec -w /app smoke alembic heads | cut -d' ' -f1)
          applied=$(docker exec smoke-db psql -U ansideck -d ansideck -tAc "SELECT version_num FROM alembic_version")
          echo "image head: $head, database: $applied"
          [ -n "$head" ] && [ "$head" = "$applied" ]

      - name: Smoke test ansible-galaxy prerequisites in backend runtime image
        if: matrix.service == 'backend' && matrix.target == 'runtime'
        run: |
          docker exec smoke ansible-galaxy --version
          docker exec smoke git --version
          docker exec smoke sh -c 'mkdir -p /data/galaxy/collections && touch /data/galaxy/collections/.write-test'

      - name: Smoke test a worker from the backend runtime image
        if: matrix.service == 'backend' && matrix.target == 'runtime'
        # A worker reaches only the API's internal port, gets no database URL or keys, is
        # non-dumpable, runs playbooks as per-slot users (with docker-compose.yml's settings;
        # in production it refuses to start without them), and runs a real playbook.
        run: |
          out=$(docker run --rm -e ENVIRONMENT=production -e ANSIDECK_API_URL=http://smoke:8001 \
            -e WORKER_TOKEN=ci-test-worker-token-0123456789abcdef \
            ansideck-backend:runtime python -m app.worker 2>&1) && { echo "$out"; exit 1; }
          echo "$out" | grep -q "Refusing to start: playbook runs can't be isolated" \
            || { echo "$out"; exit 1; }
          docker run -d --name smoke-worker --network smoke-net \
            --user 0 --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID --cap-add CHOWN --cap-add KILL \
            --security-opt no-new-privileges:true --read-only --tmpfs /tmp \
            -e ENVIRONMENT=production -e PYTHONDONTWRITEBYTECODE=1 \
            -e ANSIDECK_API_URL=http://smoke:8001 \
            -e WORKER_TOKEN=ci-test-worker-token-0123456789abcdef \
            ansideck-backend:runtime python -m app.worker
          for i in $(seq 1 15); do
            docker logs smoke-worker 2>&1 | grep -q " ready: " && break
            sleep 2
          done
          docker logs smoke-worker 2>&1 | grep -q " ready: .* runs isolated" \
            || { docker logs smoke-worker; exit 1; }
          for user in 0 20000; do
            if docker exec -u "$user" smoke-worker cat /proc/1/environ > /dev/null; then
              echo "the worker's environment is readable by uid $user"; exit 1
            fi
          done
          if docker exec smoke-worker env | grep -E 'DATABASE_URL|CREDENTIAL_ENCRYPTION_KEY|AUTH_SECRET_KEY'; then
            echo "the worker has the API's secrets"; exit 1
          fi
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/smoke_key"
          python3 backend/scripts/smoke_run.py http://localhost:8000 ci-test "$RUNNER_TEMP/smoke_key" \
            || { docker logs smoke-worker; docker logs smoke; exit 1; }
          docker logs smoke-worker

      - name: Smoke test metrics in backend runtime image
        if: matrix.service == 'backend' && matrix.target == 'runtime'
        # Served on their own port, only with the token; the run above is counted, the database
        # gauges work, and the process metrics still read /proc/self in a non-dumpable process.
        run: |
          curl -sf -H "Authorization: Bearer ci-test-metrics-token-0123456789abcdef" \
            http://localhost:8002/metrics > "$RUNNER_TEMP/metrics.txt"
          grep -E '^ansideck_runs_finished_total\{project_id="1",status="success"\} 1\.0$' "$RUNNER_TEMP/metrics.txt"
          grep -E '^ansideck_db_up 1\.0$' "$RUNNER_TEMP/metrics.txt"
          grep -E '^ansideck_slots\{state="total"\} [1-9]' "$RUNNER_TEMP/metrics.txt"
          grep -E '^process_resident_memory_bytes [0-9]' "$RUNNER_TEMP/metrics.txt"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8002/metrics)" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/metrics)" = 404 ]

      - name: Smoke test the analytics views in backend runtime image
        if: matrix.service == 'backend' && matrix.target == 'runtime'
        # A Grafana-style login role, granted with the image's own CLI, reads the analytics views
        # (the run above is there) and nothing else.
        run: |
          docker exec smoke-db psql -U ansideck -d ansideck -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE grafana_ro LOGIN PASSWORD 'ci-test-grafana' NOINHERIT" \
            -c "ALTER ROLE grafana_ro SET default_transaction_read_only = on"
          docker exec smoke python -m app.cli analytics-grant grafana_ro
          as_grafana() {
            docker exec -e PGPASSWORD=ci-test-grafana smoke-db \
              psql -h 127.0.0.1 -U grafana_ro -d ansideck -v ON_ERROR_STOP=1 -tAc "$1"
          }
          [ "$(as_grafana "SELECT count(*) FROM analytics.runs WHERE status = 'success'")" = 1 ]
          if as_grafana "SELECT 1 FROM public.users LIMIT 1"; then
            echo "grafana_ro can read the users table"; exit 1
          fi

      - name: Smoke test the Grafana dashboards against the backend runtime image
        if: matrix.service == 'backend' && matrix.target == 'runtime'
        # A throwaway Prometheus scrapes the metrics and a throwaway Grafana gets both data
        # sources and the dashboards; every panel, annotation and variable query must run, and
        # the core panels must show the run above.
        run: |
          mkdir -p "$RUNNER_TEMP/prom"
          printf '%s' ci-test-metrics-token-0123456789abcdef > "$RUNNER_TEMP/prom/token"
          chmod 644 "$RUNNER_TEMP/prom/token"
          cat > "$RUNNER_TEMP/prom/prometheus.yml" <<'YAML'
          scrape_configs:
            - job_name: ansideck
              scrape_interval: 5s
              scrape_timeout: 4s
              authorization:
                type: Bearer
                credentials_file: /etc/prometheus/token
              static_configs:
                - targets: ["smoke:8002"]
          YAML
          docker run -d --name smoke-prometheus --network smoke-net \
            -v "$RUNNER_TEMP/prom/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$RUNNER_TEMP/prom/token:/etc/prometheus/token:ro" \
            prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          docker run -d --name smoke-grafana --network smoke-net -p 127.0.0.1:3000:3000 \
            -e GF_SECURITY_ADMIN_PASSWORD=ci-test-grafana-admin \
            grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 2
          done
          # Two scrapes after the target is up, so rates have two samples.
          for i in $(seq 1 30); do
            docker exec smoke-prometheus wget -qO- 'http://localhost:9090/api/v1/query?query=up' \
              | grep -q '"value":\[[0-9.]*,"1"\]' && break
            sleep 2
          done
          sleep 12
          GRAFANA_PASSWORD=ci-test-grafana-admin POSTGRES_PASSWORD=ci-test-grafana \
            python3 grafana/tools/verify_dashboards.py --grafana http://localhost:3000 \
              --prometheus-url http://smoke-prometheus:9090 --scrape-interval 5s \
              --postgres smoke-db:5432 --database ansideck --postgres-user grafana_ro \
              --since now-15m --interval-ms 5000 \
              --expect-data Database --expect-data "Workers online" \
              --expect-data "Runs queued and running" --expect-data "API requests by status" \
              --expect-data "Finished runs by status" --expect-data Workers \
              --expect-data "Sign-ins by outcome and method" \
            || { docker logs smoke-grafana 2>&1 | tail -40; exit 1; }

      - name: Smoke test dynamic inventory sources with the backend runtime image
        if: matrix.service == 'backend' && matrix.target == 'runtime'
        # The isolated worker above refreshes generator and constructed sources over a static
        # host (ansible-inventory as a slot user); a run reaches the host through a group only
        # constructed made, and a broken source fails the refresh with its reason.
        run: |
          python3 backend/scripts/smoke_inventory.py http://localhost:8000 ci-test "$RUNNER_TEMP/smoke_key" \
            || { docker logs smoke-worker 2>&1 | tail -40; docker logs smoke 2>&1 | tail -40; exit 1; }

      - name: Smoke test the secret store with the backend runtime image
        if: matrix.service == 'backend' && matrix.target == 'runtime'
        # An OpenBao dev server set up by backend/scripts/openbao_dev_setup.py (as the compose
        # openbao profile is; piped in, it isn't part of the image) keeps the smoke key. A run
        # uses it and AnsiDeck stores it nowhere; with the store down the next run fails with
        # its reason and raises the secrets.unavailable alert.
        run: |
          docker run -d --name smoke-bao --network smoke-net \
            -e BAO_DEV_ROOT_TOKEN_ID=ci-smoke-root -e BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            -e BAO_ADDR=http://127.0.0.1:8200 -e BAO_TOKEN=ci-smoke-root \
            openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
          for i in $(seq 1 15); do
            docker exec smoke-bao bao status > /dev/null && break
            sleep 2
          done
          docker exec -i -e OPENBAO_ROOT_TOKEN=ci-smoke-root smoke python - --url http://smoke-bao:8200 \
            < backend/scripts/openbao_dev_setup.py
          docker exec -i smoke-bao bao kv put -mount=secret ansideck/1/smoke/ssh private_key=- \
            < "$RUNNER_TEMP/smoke_key"
          cat > "$RUNNER_TEMP/store.env" <<'ENV'
          SECRETS_STORE_URL=http://smoke-bao:8200
          SECRETS_STORE_AUTH=approle
          SECRETS_STORE_ROLE_ID=ansideck-dev
          SECRETS_STORE_SECRET_ID_FILE=/data/openbao/secret_id
          SECRETS_STORE_PROJECT_POLICY=ansideck-project-{project_id}
          ENV
          docker rm -f smoke
          docker run -d --name smoke --network smoke-net -p 8000:8000 -p 127.0.0.1:8002:8002 \
            --env-file "$RUNNER_TEMP/smoke.env" --env-file "$RUNNER_TEMP/store.env" \
            -v smoke-data:/data ansideck-backend:runtime
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/api/health > /dev/null && break
            sleep 2
          done
          python3 backend/scripts/smoke_run.py http://localhost:8000 ci-test --store-path smoke/ssh \
            || { docker logs smoke-worker; docker logs smoke; exit 1; }
          marker=$(sed -n 2p "$RUNNER_TEMP/smoke_key")
          if { docker exec smoke-db pg_dump -U ansideck ansideck; docker logs smoke 2>&1;
               docker logs smoke-worker 2>&1; } | grep -qF -- "$marker"; then
            echo "the stored key is in the database or the logs"; exit 1
          fi
          docker stop smoke-bao
          python3 backend/scripts/smoke_run.py http://localhost:8000 ci-test --store-path smoke/ssh \
            --expect-reason "from OpenBao: the secret store can't be reached" \
            || { docker logs smoke; exit 1; }
          alert=$(docker exec smoke-db psql -U ansideck -d ansideck -tAc \
            "SELECT key FROM notification_alerts WHERE key = 'secrets.unavailable'")
          [ "$alert" = "secrets.unavailable" ] || { echo "no secrets.unavailable alert"; exit 1; }

      - name: Smoke test frontend runtime image
        if: matrix.service == 'frontend' && matrix.target == 'runtime'
        run: |
          docker run -d --name smoke -p 8080:8080 ansideck-frontend:runtime
          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/ && break
            sleep 2
          done
          curl -sf http://localhost:8080/ | grep -q "AnsiDeck"
          headers=$(curl -sfI http://localhost:8080/)
          for header in "content-security-policy: default-src 'self'" "x-content-type-options: nosniff" \
                        "x-frame-options: DENY" "referrer-policy: no-referrer"; do
            echo "$headers" | grep -qi "^$header" || { echo "missing header: $header"; echo "$headers"; exit 1; }
          done
          docker logs smoke
