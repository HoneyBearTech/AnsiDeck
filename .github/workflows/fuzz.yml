name: Fuzz

# Coverage-guided fuzzing (Atheris) of the backend's Hypothesis properties:
# a short run on backend PRs, a longer one weekly. See backend/fuzz/.
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzzing time per target, in seconds (1 to 3600)"
        type: number
        default: 600

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - scrub_text
          - scrub_long_secrets
          - scrub_short_secrets
          - scrub_idempotent
          - scrub_event_leaks
          - scrub_event_fail_closed
          - collect_secrets
          - vault_decrypt
          - vault_encrypt
          - inventory_render
          - known_hosts
          - passkey_assertion
          - passkey_registration
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24" # the same as backend/Dockerfile
          enable-cache: true
          # Atheris ships wheels for CPython 3.12-3.14 only; the backend needs 3.12.11+.
          python-version: ">=3.12.11,<3.13"
      - run: uv sync --frozen --group fuzz
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || (github.event_name == 'pull_request' && '60') || '600' }}
        run: |
          # A manual run's input: a whole number of seconds within bounds, nothing else.
          if ! [[ "$SECONDS_PER_TARGET" =~ ^[0-9]+$ ]] || (( 10#$SECONDS_PER_TARGET < 1 || 10#$SECONDS_PER_TARGET > 3600 )); then
            echo "seconds must be a whole number from 1 to 3600, got: $SECONDS_PER_TARGET"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/crashes"
          uv run --frozen python fuzz/fuzz_properties.py "$TARGET" \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=10 \
            -artifact_prefix="$RUNNER_TEMP/crashes/$TARGET-"
      # Replay locally (Linux x86_64): uv run python fuzz/fuzz_properties.py <target> <file>
      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: ${{ runner.temp }}/crashes/
          if-no-files-found: ignore
