name: Docker Publish

# A release: pushing a version tag (vX.Y.Z) publishes both images to GHCR and a GitHub Release.
# Each image is scanned with Trivy first (any fixable HIGH or CRITICAL vulnerability stops the
# release), pushed with SBOM and SLSA provenance attestations, and signed keylessly with cosign
# (Sigstore, identity = this workflow on the tag). The release carries a source archive, the image
# digests and a signed SHA256SUMS. How to verify: docs/verifying-releases.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: the Sigstore certificate comes from this job's OIDC token
    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the image name
        # GHCR image paths must be all-lowercase; github.repository_owner
        # preserves the org/user's actual casing (e.g. "HoneyBearTech").
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${owner}/ansideck-${SERVICE}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          build-contexts: repo=.
          target: runtime
          load: true
          push: false
          tags: ansideck-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}-runtime

      # Findings recorded as not affecting AnsiDeck in the OpenVEX document are suppressed
      # (docs/dependencies.md).
      - name: Scan for fixable HIGH and CRITICAL vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$GITHUB_WORKSPACE/.vex:/vex:ro"
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          --vex /vex/ansideck.openvex.json
          ansideck-${{ matrix.service }}:scan

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          build-contexts: repo=.
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}-runtime
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-runtime

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "${IMAGE}@${DIGEST}" > "image-${SERVICE}.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.service }}
          path: image-${{ matrix.service }}.txt
          retention-days: 1

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless signing of SHA256SUMS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true

      - name: Source archive, image list and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          git archive --format=tar.gz --prefix="ansideck-${version}/" -o "ansideck-${version}.tar.gz" HEAD
          cat image-backend.txt image-frontend.txt > images.txt
          sha256sum "ansideck-${version}.tar.gz" images.txt > SHA256SUMS
          cat images.txt SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          # The "## [x.y.z]" section of CHANGELOG.md, up to the next "## [" heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi
          printf '\n---\nVerify the images and this release: [docs/verifying-releases.md](https://github.com/%s/blob/%s/docs/verifying-releases.md)\n' \
            "$REPO" "$TAG" >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --repo "$REPO" --verify-tag "${prerelease[@]}" \
            --title "AnsiDeck ${TAG}" --notes-file notes.md \
            ansideck-*.tar.gz images.txt SHA256SUMS SHA256SUMS.sigstore.json
