name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 6" # weekly, Saturday 02:41 UTC

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish results to the OpenSSF API (README badge)
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # publish_results sends this public repository's results to the OpenSSF API, which is
      # what the README badge reads. Set it to false (and drop id-token: write) to keep them
      # in this repository's code-scanning alerts only.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
